# Compila el APK de Savart en GitHub (sin Android Studio).
# 1) Baja la PWA actual de erkdevcr/savart (solo lectura, nunca escribe en ese repo)
# 2) La mete en la app (cap sync)  3) Compila y firma  4) Publica un release nuevo (se conservan todos; el más nuevo queda como "Latest")
# Una vez por semana revisa si erkdevcr/savart cambió; si cambió, compila solo (no hace falta token).
name: Build APK

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'    # lunes 06:23 UTC (domingo 00:23 en Costa Rica): ¿hay commit nuevo en savart?

permissions:
  contents: write           # para publicar el APK en Releases de ESTE repo

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.c.outputs.sha }}
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - id: c
        name: ¿Cambió savart desde el último APK?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git ls-remote https://github.com/erkdevcr/savart HEAD | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          LAST=$(gh release view -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -oE 'web-sha: [0-9a-f]+' | cut -d' ' -f2)
          echo "savart: $SHA · último APK: ${LAST:-ninguno}"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$SHA" != "$LAST" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en savart — no se compila."
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Código de la app Android
        uses: actions/checkout@v5

      - name: PWA actual (erkdevcr/savart, solo lectura)
        uses: actions/checkout@v5
        with:
          repository: erkdevcr/savart
          ref: ${{ needs.check.outputs.sha }}
          path: web
          # Si el repo savart es privado, crear el secreto WEB_REPO_TOKEN (token de solo lectura)
          token: ${{ secrets.WEB_REPO_TOKEN || github.token }}

      - name: Copiar la PWA a www/
        run: |
          rm -rf www && mkdir www
          rsync -a --exclude '.git' --exclude '.github' web/ www/
          VER=$(grep -oE "APP_VERSION *= *'[^']+'" www/sw.js | grep -oE "[0-9][0-9.]*" | head -1)
          echo "WEB_VERSION=${VER:-0}" >> "$GITHUB_ENV"
          echo "PWA versión: ${VER}"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle            # guarda las dependencias entre compilaciones

      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Llave de firma (fija, la del repo)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Usando la llave del secreto DEBUG_KEYSTORE_B64"
          elif [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore ~/.android/debug.keystore
            echo "Usando signing/debug.keystore del repo (siempre la misma firma)"
          else
            echo "::warning::Sin llave fija — el APK sale con una firma distinta en cada compilación."
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Reintenta si Maven Central responde 429 (demasiadas solicitudes)
          for n in 1 2 3; do
            ./gradlew assembleDebug -Pvc=${{ github.run_number }} -Pvn="${WEB_VERSION}" --no-daemon && exit 0
            echo "::warning::Intento $n falló, reintento en $((n*45))s"; sleep $((n*45))
          done
          exit 1

      - name: Publicar release nuevo (se conservan los anteriores)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="savart-${WEB_VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          TAG="v${WEB_VERSION}-b${{ github.run_number }}"
          # El viejo release fijo "latest" (de antes) se quita una sola vez; los demás se conservan
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" --latest \
            --title "Savart ${WEB_VERSION} (build ${{ github.run_number }})" \
            --notes "PWA ${WEB_VERSION} · compilado $(date -u +'%Y-%m-%d %H:%M UTC')
          web-sha: ${{ needs.check.outputs.sha }}"
