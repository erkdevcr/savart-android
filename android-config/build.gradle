/*
  android/build.gradle  — modificaciones para Savart
  ───────────────────────────────────────────────────
  INSTRUCCIONES: Después de correr "npx cap add android", abre
  android/build.gradle y agrega la línea marcada con ← AGREGAR.
*/

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.1'  // ← AGREGAR esta línea
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
